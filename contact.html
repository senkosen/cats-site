  <main>
    <section>
      <h2>Свяжитесь с нами</h2>
      <p>Если у вас есть фото для галереи, интересные факты или просто хочется поболтать о кошках — напишите нам!</p>

      <form>
        <label for="name">Ваше имя:</label>
        <input type="text" id="name" name="name" placeholder="Как вас зовут?" />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Ваш email" />

        <label for="message">Сообщение:</label>
        <textarea id="message" name="message" rows="5" placeholder="Расскажите про вашего кота..."></textarea>

        <button type="submit">Отправить</button>
      </form>

      <div class="contact-info">
        <p>Почта: cats@example.com</p>
        <p>Соцсети: @catsworld_ru</p>
      </div>
    </section>
